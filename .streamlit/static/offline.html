<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniLife OS — 离线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f1e8;
      color: #1f1713;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container {
      width: min(100%, 400px);
      padding: 1.25rem;
      border: 1px solid rgba(31, 23, 19, 0.14);
      border-radius: 8px;
      background: #fffdf8;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 {
      color: #1f1713;
      font-size: 1.35rem;
      line-height: 1.25;
      margin-bottom: 0.75rem;
      letter-spacing: 0;
    }
    p {
      color: #554941;
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 1.35rem;
    }
    button {
      width: 100%;
      padding: 0.78rem 1rem;
      color: #fffdf8;
      background: #2a211b;
      border: 1px solid #2a211b;
      border-radius: 4px;
      font-size: 0.96rem;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #3b2d24; border-color: #3b2d24; }
    button:active { opacity: 0.86; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>网络连接中断</h1>
    <p>UniLife OS 需要网络连接才能正常工作。<br>请检查网络后重试。</p>
    <button onclick="location.reload()">🔄 重新连接</button>
  </div>
</body>
</html>
